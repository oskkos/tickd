<!doctype html>
<!--
  data-theme belongs on <html>, never on a subtree: Base UI portals dialogs and drawers outside the
  React root, and a scoped theme would leave them unthemed. CONCEPT.md / DESIGN.md §5.
-->
<html lang="en" data-theme="dim">
  <head>
    <meta charset="UTF-8" />
    <!--
      maximum-scale is deliberately absent: pinch-zoom stays available for accessibility.
      interactive-widget keeps the on-screen keyboard from shoving the layout around during entry.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="description" content="An indoor climbing logbook. Rope and boulder." />
    <meta name="theme-color" content="#1c212b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <title>tickd</title>
    <!--
      The stored theme, applied before the bundle loads.

      This cannot be a React effect. An effect paints the document's own `data-theme` first and then
      replaces it, so every cold start on a stored light theme — or on a dark system preference against
      the attribute below — shows the wrong theme for a frame. In a dim gym that is a flash of white at
      the moment the app is opened, which is the condition DESIGN.md §3 makes dark mode non-optional for.

      It duplicates `resolveTheme` in `features/settings/preferences.ts` by necessity: nothing is loaded
      yet. Keep the two in step — the module is the authority, this is its earliest possible echo. A
      failure here degrades to the attribute above, and `main.tsx` re-applies the resolved theme once
      the bundle is up, so a blocked `localStorage` costs a frame rather than the preference.
    -->
    <script>
      try {
        var pref = localStorage.getItem('tickd.theme');
        var dark =
          pref === 'dark' ||
          (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dim' : 'winter';
      } catch (e) {
        /* No storage, no matchMedia, or both. The markup's own theme stands. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
